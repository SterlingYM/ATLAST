# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # nbsphinx shells out to pandoc to convert the notebooks' markdown cells.
    # It is not a Python package, so pip cannot supply it.
    - pandoc

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    # Installing the package itself brings in numpy/scipy/pandas/astropy, which
    # autodoc needs in order to import atlast. The docs extra adds sphinx and
    # its plugins.
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip
