[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlast"
version = "0.1"
description = "An all-in-one toolkit to download, visualize, and analyze ATLAS light curves"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "astropy>=6.0",
    "tqdm>=4.66",
    "requests>=2.32",
]

[project.optional-dependencies]
# Building the docs also needs pandoc, which is not a Python package.
# See .readthedocs.yaml, or install it with conda/brew locally.
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "nbsphinx>=0.9",
    # supplies the 'ipython3' Pygments lexer that the notebooks declare;
    # without it every code cell warns, which fails the build under -W
    "ipython>=8.0",
]
# Light curve fitting and spline-based clipping are optional at runtime.
fitting = [
    "sncosmo>=2.10",
    "iminuit>=2.0",
]
smoothing = [
    "csaps>=1.1",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["atlast"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

# [project.scripts]